<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coscolin House of Design | Exclusive Collection</title>
  <style>
    :root {
      --bg-color: #fcfbfa;
      --card-bg: #ffffff;
      --text-main: #1f1f1f;
      --text-muted: #666666;
      --accent-color: #2b2b2b;
      --border-color: #eaeaea;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 2rem 1rem;
      line-height: 1.5;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    header h1 {
      font-size: 2.2rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }

    header p {
      color: var(--text-muted);
      font-size: 1rem;
    }

    /* Filter Controls Styling */
    .filter-container {
      display: flex;
      justify-content: center;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-bottom: 2.5rem;
    }

    .filter-btn {
      background-color: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 0.5rem 1.25rem;
      border-radius: 20px;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .filter-btn:hover {
      border-color: var(--text-main);
      color: var(--text-main);
    }

    .filter-btn.active {
      background-color: var(--accent-color);
      color: #ffffff;
      border-color: var(--accent-color);
    }

    /* Product Grid Layout */
    .catalog-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 2rem;
    }

    /* Product Card */
    .product-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
      transition: transform 0.2s ease, opacity 0.3s ease;
    }

    .product-card.hidden {
      display: none;
    }

    .product-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.05);
    }

    .image-wrapper {
      width: 100%;
      height: 320px;
      background-color: #f4f4f4;
      overflow: hidden;
    }

    .image-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .product-info {
      padding: 1.25rem;
    }

    .product-category {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      margin-bottom: 0.25rem;
    }

    .product-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .product-price {
      font-size: 1rem;
      font-weight: 500;
      color: var(--accent-color);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Coscolin House of Design</h1>
      <p>Custom Bags, Charms & Fine Jewelry Collection</p>
    </header>

    <!-- Category Filter Buttons -->
    <nav class="filter-container">
      <button class="filter-btn active" data-filter="all">All Items</button>
      <button class="filter-btn" data-filter="bags">Bags</button>
      <button class="filter-btn" data-filter="charms">Charms</button>
      <button class="filter-btn" data-filter="jewelry">Jewelry</button>
    </nav>

    <main class="catalog-grid">

      <!-- Item 1: Bags -->
      <article class="product-card" data-category="bags">
        <div class="image-wrapper">
          <img src="/images/bag1.jpg" alt="Signature Custom Tote Bag" loading="lazy" />
        </div>
        <div class="product-info">
          <div class="product-category">Bags</div>
          <h2 class="product-title">Signature Custom Tote</h2>
          <div class="product-price">RM 450.00</div>
        </div>
      </article>

      <!-- Item 2: Charms -->
      <article class="product-card" data-category="charms">
        <div class="image-wrapper">
          <img src="/images/charm1.jpg" alt="Handcrafted Leather Bag Charm" loading="lazy" />
        </div>
        <div class="product-info">
          <div class="product-category">Charms</div>
          <h2 class="product-title">Handcrafted Bag Charm</h2>
          <div class="product-price">RM 120.00</div>
        </div>
      </article>

      <!-- Item 3: Jewelry -->
      <article class="product-card" data-category="jewelry">
        <div class="image-wrapper">
          <img src="/images/jewelry1.jpg" alt="Artisanal Pendant Necklace" loading="lazy" />
        </div>
        <div class="product-info">
          <div class="product-category">Jewelry</div>
          <h2 class="product-title">Artisanal Pendant Necklace</h2>
          <div class="product-price">RM 280.00</div>
        </div>
      </article>

      <!-- Item 4: Bags -->
      <article class="product-card" data-category="bags">
        <div class="image-wrapper">
          <img src="/images/bag2.jpg" alt="Structured Atelier Handbag" loading="lazy" />
        </div>
        <div class="product-info">
          <div class="product-category">Bags</div>
          <h2 class="product-title">Structured Atelier Handbag</h2>
          <div class="product-price">RM 680.00</div>
        </div>
      </article>

    </main>
  </div>

  <!-- Interactive JavaScript Filter Script -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const filterButtons = document.querySelectorAll(".filter-btn");
      const productCards = document.querySelectorAll(".product-card");

      filterButtons.forEach(button => {
        button.addEventListener("click", () => {
          // Remove active state from all buttons and add to clicked button
          filterButtons.forEach(btn => btn.classList.remove("active"));
          button.classList.add("active");

          const filterValue = button.getAttribute("data-filter");

          // Show or hide product cards based on category matching
          productCards.forEach(card => {
            const cardCategory = card.getAttribute("data-category");
            if (filterValue === "all" || filterValue === cardCategory) {
              card.classList.remove("hidden");
            } else {
              card.classList.add("hidden");
            }
          });
        });
      });
    });
  </script>

</body>
</html>
