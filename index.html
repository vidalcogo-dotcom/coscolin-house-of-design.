<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coscolin House of Design</title>
  <style>
    :root {
      --bg-color: #0d0d0d;
      --card-bg: #141414;
      --card-border: #262626;
      --text-main: #f5f5f7;
      --text-muted: #a1a1a6;
      --banner-bg: #000000;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding-bottom: 4rem;
      line-height: 1.5;
    }

    header.brand-header {
      background-color: var(--banner-bg);
      border-bottom: 1px solid var(--card-border);
      padding: 2.5rem 1rem;
      text-align: center;
      margin-bottom: 2rem;
    }

    .brand-logo-container {
      max-width: 600px;
      margin: 0 auto;
    }

    .brand-logo-svg {
      width: 100%;
      max-width: 480px;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 1rem;
    }

    .showcase-section {
      background: #111111;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 2rem;
      margin-bottom: 3rem;
    }

    .showcase-header {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .showcase-title {
      font-size: 1.8rem;
      font-weight: 600;
      letter-spacing: 0.05em;
    }

    .showcase-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    .filter-container {
      display: flex;
      justify-content: center;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-bottom: 2.5rem;
    }

    .filter-btn {
      background-color: transparent;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 0.6rem 1.4rem;
      border-radius: 25px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .filter-btn:hover {
      border-color: var(--text-main);
      color: var(--text-main);
    }

    .filter-btn.active {
      background-color: var(--text-main);
      color: #000000;
      border-color: var(--text-main);
      font-weight: 600;
    }

    .catalog-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 2rem;
    }

    .product-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      overflow: hidden;
      transition: transform 0.3s ease;
    }

    .product-card.hidden {
      display: none;
    }

    .product-card:hover {
      transform: translateY(-5px);
    }

    .image-wrapper {
      width: 100%;
      height: 340px;
      background-color: #1a1a1a;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .image-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .product-info {
      padding: 1.25rem;
    }

    .product-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text-main);
    }
  </style>
</head>
<body>

  <!-- Brand Script Header -->
  <header class="brand-header">
    <div class="brand-logo-container">
      <svg class="brand-logo-svg" viewBox="0 0 500 140" fill="none" xmlns="http://www.w3.org/2000/svg">
        <text x="50%" y="70" text-anchor="middle" fill="#FFFFFF" font-family="'Brush Script MT', 'Great Vibes', 'Playfair Display', cursive, serif" font-size="78" font-style="italic">Coscolin</text>
        <text x="50%" y="115" text-anchor="middle" fill="#FFFFFF" font-family="'Georgia', serif" font-size="24" font-style="italic" letter-spacing="3">House of Design</text>
      </svg>
    </div>
  </header>

  <div class="container">

    <!-- Terra Mare Showcase Section -->
    <section class="showcase-section">
      <div class="showcase-header">
        <h2 class="showcase-title">Terra Mare Collection</h2>
      </div>
      <div class="showcase-grid">

        <article class="product-card" data-category="bags">
          <div class="image-wrapper">
            <img src="Terra%20Mare%20Blue.png" alt="Terra Mare Blue Tote" loading="lazy" />
          </div>
          <div class="product-info">
            <h3 class="product-title">Terra Mare Blue Tote</h3>
          </div>
        </article>

        <article class="product-card" data-category="bags">
          <div class="image-wrapper">
            <img src="Mare%20Terra.png" alt="Mare Terra Tote" loading="lazy" />
          </div>
          <div class="product-info">
            <h3 class="product-title">Mare Terra Tote</h3>
          </div>
        </article>

        <article class="product-card" data-category="bags">
          <div class="image-wrapper">
            <img src="The%20Patch%20ToteBag.PNG" alt="The Patch Tote Bag" loading="lazy" />
          </div>
          <div class="product-info">
            <h3 class="product-title">The Patch Tote Bag</h3>
          </div>
        </article>

      </div>
    </section>

    <!-- Filter Buttons -->
    <nav class="filter-container">
      <button class="filter-btn active" data-filter="all">All Items</button>
      <button class="filter-btn" data-filter="bags">Bags & Totes</button>
      <button class="filter-btn" data-filter="charms">Bag Charms</button>
      <button class="filter-btn" data-filter="jewelry">Jewelry</button>
      <button class="filter-btn" data-filter="atelier">Atelier Creations</button>
    </nav>

    <!-- Catalog Grid -->
    <main class="catalog-grid">

      <article class="product-card" data-category="bags">
        <div class="image-wrapper">
          <img src="Flower%20Pouchy.png" alt="Flower Pouchy" loading="lazy" />
        </div>
        <div class="product-info">
          <h3 class="product-title">Flower Pouchy</h3>
        </div>
      </article>

      <article class="product-card" data-category="jewelry">
        <div class="image-wrapper">
          <img src="C7C14FF0-4BD7-4CBB-B6C9-163DB3A96B92.jpg" alt="Jewelry Model Asset" loading="lazy" />
        </div>
        <div class="product-info">
          <h3 class="product-title">Jewelry Model Asset</h3>
        </div>
      </article>

      <article class="product-card" data-category="jewelry">
        <div class="image-wrapper">
          <img src="70161D89-374F-405A-A611-6FC8411621BE.jpg" alt="Pendant Showcase" loading="lazy" />
        </div>
        <div class="product-info">
          <h3 class="product-title">Jewelry & Pendant</h3>
        </div>
      </article>

      <article class="product-card" data-category="charms">
        <div class="image-wrapper">
          <img src="C2F5F53B-9583-4488-814A-38BE3BED084D.jpg" alt="Bag Charm" loading="lazy" />
        </div>
        <div class="product-info">
          <h3 class="product-title">Bag Charm Collection</h3>
        </div>
      </article>

      <article class="product-card" data-category="atelier">
        <div class="image-wrapper">
          <img src="My%20Creations%20with%20AI.png" alt="My Creations with AI" loading="lazy" />
        </div>
        <div class="product-info">
          <h3 class="product-title">AI Design Concepts</h3>
        </div>
      </article>

      <article class="product-card" data-category="atelier">
        <div class="image-wrapper">
          <img src="Various%20products.png" alt="Various Products" loading="lazy" />
        </div>
        <div class="product-info">
          <h3 class="product-title">Various Custom Products</h3>
        </div>
      </article>

    </main>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const filterButtons = document.querySelectorAll(".filter-btn");
      const productCards = document.querySelectorAll(".product-card");

      filterButtons.forEach(button => {
        button.addEventListener("click", () => {
          filterButtons.forEach(btn => btn.classList.remove("active"));
          button.classList.add("active");

          const filterValue = button.getAttribute("data-filter");

          productCards.forEach(card => {
            const cardCategory = card.getAttribute("data-category");
            if (filterValue === "all" || filterValue === cardCategory) {
              card.classList.remove("hidden");
            } else {
              card.classList.add("hidden");
            }
          });
        });
      });
    });
  </script>

</body>
</html>
